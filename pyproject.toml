[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoammonia"
version = "0.1.0"
description = "A package for ammonia SDL automation."
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
readme = "readme.md"
requires-python = ">=3.8"
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
autoammonia_flow_off_dynamic = "autoammonia.prefect_deploy.dynamic_flows_shutdown:main"
autoammonia_deploy_reaction = "autoammonia.prefect_deploy.deploy_reaction:main"
autoammonia_deploy_reaction_sim = "autoammonia.prefect_deploy.deploy_reaction_sim:main"
autoammonia_deploy_reaction_mock = "autoammonia.prefect_deploy.deploy_reaction_mock:main"
autoammonia_deploy_analysis = "autoammonia.prefect_deploy.deploy_analysis:main"
autoammonia_deploy_analysis_sim = "autoammonia.prefect_deploy.deploy_analysis_sim:main"
autoammonia_deploy_analysis_mock = "autoammonia.prefect_deploy.deploy_analysis_mock:main"
autoammonia_run = "autoammonia.prefect_deploy.trigger_deploys:main"
autoammonia_rx_test = "autoammonia.testing.rx_module_test:main"
autoammonia_hardware_test_rx = "autoammonia.testing.hardware_reaction_test:main"
autoammonia_hardware_test_az = "autoammonia.testing.hardware_analysis_test:main"
autoammonia_tecan_volume_test = "autoammonia.scripts.tecan_tubes_volume_testing:main"
autoammonia_leak_test = "autoammonia.scripts.leaks_testing:leaks_testing"
autoammonia_exp_requester = "autoammonia.experiment_queue:request_experiments"
autoammonia_db_create_tables = "autoammonia.db.create_tables:main"
autoammonia_db_test = "autoammonia.db.test_db_connection:main"
autoammonia_db_drop_tables = "autoammonia.db.drop_tables:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [".venv", ".git", "__pycache__", "src/autoammonia/testing"]
markers = [
    "hardware: marks tests as requiring physical hardware (deselect with '-m \"not hardware\"')",
    "integration: marks tests as integration tests that may take longer",
    "unit: marks tests as unit tests (fast, no external dependencies)",
]