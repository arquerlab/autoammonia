[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoammonia"
version = "0.1.0"
description = "A package for ammonia SDL automation."
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
readme = "readme.md"
requires-python = ">=3.8"
dependencies = [
    # Add your runtime dependencies here, e.g.:
    # "sqlalchemy>=1.4",
    # "requests>=2.25"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]