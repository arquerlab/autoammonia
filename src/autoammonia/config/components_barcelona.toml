address = 2
num_port = 12

[valveAZ01]
class = "matterlab_valves.RunzeSelectionValve"
com_port = "COM14"
address = 1
num_port = 12

[potentiostat01]
class = "pyBEEP.PotentiostatController"
device_class = "pyBEEP.PotentiostatDevice"
