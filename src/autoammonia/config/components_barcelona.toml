[longerWE01]
class = "matterlab_pumps.LongerPeristalticPump"
com_port = "COM10"
address = 1
baudrate = 1200

[longerCE01]
class = "matterlab_pumps.LongerPeristalticPump"
com_port = "COM10"
address = 2
baudrate = 1200

[tecanRX01]
class = "matterlab_pumps.RunzePump"
com_port = "COM5"
address = 3
syringe_volume = 0.005
num_valve_port = 12

[tecanAZ01]
class = "matterlab_pumps.RunzePump"
com_port = "COM5"
address = 1
syringe_volume = 0.00125
num_valve_port = 12

[valveRX01]
class = "matterlab_valves.RunzeSelectionValve"
