[global]
simulation = false

[longerWE01]
class = "matterlab_pumps.LongerPeristalticPump"
com_port = "/dev/longer_pumps"
address = 1
baudrate = 1200

[longerCE01]
class = "matterlab_pumps.LongerPeristalticPump"
com_port = "/dev/longer_pumps"
address = 2
baudrate = 1200

[tecanRX01]
class = "matterlab_pumps.TecanXCPump"
com_port = "/dev/tecan_pumps"
address = 2
syringe_volume = 0.0025
num_valve_port = 12

[valveRX01]
class = "matterlab_valves.ValcoSelectionValve"
com_port = "/dev/valveRX01"
num_port = 10

[potentiostat01]
class = "pyBEEP.PotentiostatController"
device_class = "pyBEEP.PotentiostatDevice"
device_kwargs = { port = "/dev/potentiostat01", address = 1 }

[UVVIS01]
class = "matterlab_spectrometers.HamamatsuMiniSpectrometer"

[lamp01]
class = "autoammonia.hardware.uv_vis_lamp.Arduino"
device_class = "autoammonia.hardware.uv_vis_lamp.MotorSwitchLamp"
com_port = "COM5"
pulsed = false
